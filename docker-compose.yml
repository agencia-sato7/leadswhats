services:
  postgres:
    image: postgres:16-alpine
    container_name: leadswhats_postgres
    environment:
      POSTGRES_DB: leadswhats
      POSTGRES_USER: leadswhats
      POSTGRES_PASSWORD: leadswhats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadswhats -d leadswhats"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadswhats_network

  redis:
    image: redis:7-alpine
    container_name: leadswhats_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadswhats_network

  adminer:
    image: adminer:latest
    container_name: leadswhats_adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leadswhats_network
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    container_name: leadswhats_ai_service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - leadswhats_network
    restart: unless-stopped

  backend:
    image: laravelsail/php84-composer:latest
    container_name: leadswhats_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      # APP_ENV e as credenciais de DB_* propositalmente NÃO ficam aqui: como
      # env vars de container elas vencem o .env e o próprio phpunit.xml (que
      # tenta forçar APP_ENV=testing / DB_CONNECTION=sqlite via <env force>),
      # fazendo os testes (RefreshDatabase -> migrate:fresh) rodarem contra o
      # Postgres real de dev e apagando os dados. Já estão corretas em
      # backend/.env (APP_ENV=local, DB_CONNECTION=pgsql apontando pro mesmo
      # host/porta/banco) — mantenha só lá.
      APP_DEBUG: "true"
      APP_URL: https://leadswhats.appsato7.com.br
      APP_SERVICE: https://leadswhats.appsato7.com.br
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DOMAIN: .appsato7.com.br
      SANCTUM_STATEFUL_DOMAINS: leadswhats.appsato7.com.br
      TRUSTED_PROXIES: "*"
      PHP_CLI_SERVER_WORKERS: "4"
      CONVERSATION_ANALYZER: python
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TIMEOUT_SECONDS: "90"
      AI_SERVICE_CONNECT_TIMEOUT_SECONDS: "5"
    command: >
      sh -c "
        apt-get update && apt-get install -y libpq-dev &&
        docker-php-ext-install pdo_pgsql &&
        if [ ! -f artisan ]; then
          composer create-project laravel/laravel . --prefer-dist --no-interaction
        fi &&
        if [ ! -d vendor ]; then
          composer install --no-interaction
        fi &&
        php artisan key:generate --no-interaction &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan serve --host=0.0.0.0 --port=9000
      "
    ports:
      - "9000:9000"  # Mapear porta 9000 do host para 9000 do container
    networks:
      - leadswhats_network
    restart: unless-stopped

  campaign-worker:
    image: laravelsail/php84-composer:latest
    container_name: leadswhats_campaign_worker
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      APP_DEBUG: "true"
      APP_URL: https://leadswhats.appsato7.com.br
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONVERSATION_ANALYZER: python
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TIMEOUT_SECONDS: "90"
      AI_SERVICE_CONNECT_TIMEOUT_SECONDS: "5"
    command: >
      sh -c "
        apt-get update && apt-get install -y libpq-dev &&
        docker-php-ext-install pdo_pgsql &&
        until [ -f artisan ] && [ -d vendor ]; do sleep 2; done &&
        php artisan queue:work --queue=campaign-intelligence --tries=3 --timeout=600 --sleep=2
      "
    networks:
      - leadswhats_network
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: leadswhats_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:9000/api/v1
    command: sh -lc "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5174:5173"
    networks:
      - leadswhats_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: leadswhats_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - leadswhats_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  leadswhats_network:
    driver: bridge
