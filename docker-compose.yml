services:
  postgres:
    image: postgres:16-alpine
    container_name: leadswhats_postgres
    environment:
      POSTGRES_DB: leadswhats
      POSTGRES_USER: leadswhats
      POSTGRES_PASSWORD: leadswhats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadswhats -d leadswhats"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadswhats_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: laravelsail/php84-composer:latest
    container_name: leadswhats_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: sh -lc "if [ ! -f artisan ]; then composer create-project laravel/laravel .; fi && mkdir -p database && touch database/database.sqlite && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:24-alpine
    container_name: leadswhats_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -lc "if [ ! -f package.json ]; then npx --yes create-vite@latest . --template react-ts; fi && npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  postgres_data:
