services:
  postgres:
    image: postgres:16-alpine
    container_name: leadswhats_postgres
    environment:
      POSTGRES_DB: leadswhats
      POSTGRES_USER: leadswhats
      POSTGRES_PASSWORD: leadswhats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadswhats -d leadswhats"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadswhats_network

  redis:
    image: redis:7-alpine
    container_name: leadswhats_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadswhats_network

  adminer:
    image: adminer:latest
    container_name: leadswhats_adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leadswhats_network
    restart: unless-stopped

  backend:
    image: laravelsail/php84-composer:latest
    container_name: leadswhats_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_URL: https://leadswhats.appsato7.com.br
      APP_SERVICE: https://leadswhats.appsato7.com.br
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: leadswhats
      DB_USERNAME: leadswhats
      DB_PASSWORD: leadswhats
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DOMAIN: .appsato7.com.br
      SANCTUM_STATEFUL_DOMAINS: leadswhats.appsato7.com.br
      TRUSTED_PROXIES: "*"
    command: >
      sh -c "
        apt-get update && apt-get install -y libpq-dev &&
        docker-php-ext-install pdo_pgsql &&
        if [ ! -f artisan ]; then
          composer create-project laravel/laravel . --prefer-dist --no-interaction
        fi &&
        if [ ! -d vendor ]; then
          composer install --no-interaction
        fi &&
        php artisan key:generate --no-interaction &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan serve --host=0.0.0.0 --port=9000
      "
    ports:
      - "9000:9000"  # Mapear porta 9000 do host para 9000 do container
    networks:
      - leadswhats_network
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: leadswhats_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -lc "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5174:5173"
    networks:
      - leadswhats_network
    restart: unless-stopped

  whatsapp-qr-service:
    image: node:22-alpine
    container_name: leadswhats_qr_service
    working_dir: /app
    volumes:
      - ./whatsapp-qr-service:/app
      - /app/node_modules
      - qr_sessions:/app/sessions
    environment:
      PORT: "3001"
      LARAVEL_WEBHOOK_URL: "http://backend:9000/api/v1/webhooks/whatsapp/baileys"
    command: sh -lc "apk add --no-cache git python3 make g++ && npm install --ignore-scripts && npm start"
    ports:
      - "3001:3001"
    networks:
      - leadswhats_network
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: leadswhats_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - leadswhats_network
    restart: unless-stopped

volumes:
  postgres_data:
  qr_sessions:

networks:
  leadswhats_network:
    driver: bridge